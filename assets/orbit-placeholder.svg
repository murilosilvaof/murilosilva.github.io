<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Orbit dashboard placeholder</title>
  <desc id="desc">Placeholder visual for the Orbit project screenshot.</desc>
  <defs>
